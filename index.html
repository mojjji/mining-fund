<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Fund | Investor Portal</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: #e2e8f0;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-text { text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center glass-card p-6 rounded-2xl">
            <div>
                <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 neon-text">
                    Alpha Mining Fund
                </h1>
                <p class="text-sm text-gray-400 mt-1">Live Investor Watcher Node • <span class="text-green-400">v2.4.1 Stable</span></p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center space-x-3">
                <div class="flex items-center space-x-2 bg-green-500/10 border border-green-500/20 px-3 py-1.5 rounded-full">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    <span class="text-xs font-bold text-green-400 uppercase tracking-wider">System Online</span>
                </div>
            </div>
        </div>

        <!-- MAIN STATS GRID -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="glass-card p-6 rounded-2xl relative overflow-hidden group">
                <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Active Fleet</p>
                <div class="mt-2 flex items-baseline space-x-2">
                    <span class="text-3xl font-bold text-white">2 <span class="text-lg text-gray-500">/ 2</span></span>
                </div>
                <p class="text-xs text-emerald-400 mt-2 flex items-center">● 100% Uptime (24h)</p>
            </div>

            <div class="glass-card p-6 rounded-2xl">
                <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Real-Time Hashrate</p>
                <div class="mt-2">
                    <span id="hashrate-display" class="text-3xl font-bold text-amber-400 font-mono">Loading...</span>
                </div>
                <div class="w-full bg-gray-700 h-1.5 rounded-full mt-4 overflow-hidden">
                    <div class="bg-gradient-to-r from-amber-500 to-orange-600 h-1.5 rounded-full" style="width: 92%;"></div>
                </div>
            </div>

            <div class="glass-card p-6 rounded-2xl border-green-500/30 shadow-[0_0_20px_rgba(34,197,94,0.1)]">
                <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Total Fund Equity</p>
                <div class="mt-2">
                    <span id="balance-display" class="text-3xl font-bold text-white font-mono tracking-tight">0.00000000</span>
                    <span class="text-sm text-gray-500 ml-1">BTC</span>
                </div>
                <p class="text-xs text-gray-400 mt-2">Next payout: <span id="next-payout-timer">04:59</span></p>
            </div>
        </div>

        <!-- PAYOUT HISTORY TABLE -->
        <div class="glass-card rounded-2xl overflow-hidden">
            <div class="p-6 border-b border-gray-700/50 flex justify-between items-center">
                <h3 class="font-bold text-lg text-gray-200">Payout Ledger</h3>
                <!-- Added id="admin-reset" and hidden style by default -->
                <button id="admin-reset" onclick="resetSimulation()" class="hidden text-xs text-red-400/50 hover:text-red-400 transition bg-red-500/10 px-2 py-1 rounded border border-red-500/20">Reset Demo</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-400">
                    <thead class="bg-gray-800/50 uppercase text-xs font-semibold text-gray-500">
                        <tr>
                            <th class="px-6 py-3">Timestamp (UTC)</th>
                            <th class="px-6 py-3">Type</th>
                            <th class="px-6 py-3">Status</th>
                            <th class="px-6 py-3 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="payout-table-body" class="divide-y divide-gray-700/30"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const INITIAL_BALANCE = 0.01428000;
        let savedBalance = localStorage.getItem('alphaFundBalance');
        let currentBalance = savedBalance ? parseFloat(savedBalance) : INITIAL_BALANCE;
        let savedHistory = localStorage.getItem('alphaFundHistory');
        let payoutHistory = savedHistory ? JSON.parse(savedHistory) : generateDefaultHistory();

        // CHECK FOR ADMIN MODE IN THE URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('admin-reset').classList.remove('hidden');
        }

        function generateDefaultHistory() {
            let history = [];
            for(let i=0; i<5; i++) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                history.push({
                    date: d.toISOString().replace('T', ' ').substring(0, 19),
                    amount: (0.00210 + (Math.random() * 0.00010)).toFixed(8)
                });
            }
            return history;
        }

        function renderTable() {
            const tbody = document.getElementById('payout-table-body');
            tbody.innerHTML = '';
            payoutHistory.forEach(row => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-mono text-xs">${row.date}</td>
                    <td class="px-6 py-4"><span class="bg-blue-500/10 text-blue-400 px-2 py-1 rounded text-xs border border-blue-500/20">Mining Reward</span></td>
                    <td class="px-6 py-4 text-green-400 text-xs font-bold">Confirmed</td>
                    <td class="px-6 py-4 text-right font-mono text-white font-bold">+${row.amount} BTC</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function saveData() {
            localStorage.setItem('alphaFundBalance', currentBalance.toFixed(8));
            localStorage.setItem('alphaFundHistory', JSON.stringify(payoutHistory));
        }

        function updateLoop() {
            let wobble = (Math.random() * 10) - 5;
            let currentHash = (400 + wobble).toFixed(1);
            document.getElementById('hashrate-display').innerText = currentHash + " TH/s";

            currentBalance += 0.00000001; 
            document.getElementById('balance-display').innerText = currentBalance.toFixed(8);
            saveData();
        }

        setInterval(() => {
            let newAmount = (0.00210 + (Math.random() * 0.00010)).toFixed(8);
            let now = new Date().toISOString().replace('T', ' ').substring(0, 19);
            payoutHistory.unshift({ date: now, amount: newAmount });
            if(payoutHistory.length > 10) payoutHistory.pop();
            currentBalance += parseFloat(newAmount);
            renderTable();
            saveData();
        }, 60000);

        renderTable();
        setInterval(updateLoop, 2000);

        window.resetSimulation = function() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
